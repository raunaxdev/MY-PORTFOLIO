<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Prevent Admin Panel from Indexing on Google -->
  <meta name="robots" content="noindex, nofollow">

  <title>Admin Dashboard | Raunak Portfolio</title>

  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <!-- Login Screen -->
  <section class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="logo-circle">R</div>
      <h1>Admin Login</h1>
      <p>Manage your digital portfolio content.</p>

      <form id="loginForm">
        <div class="input-group">
          <input type="email" id="adminEmail" placeholder="Enter Admin Email" required />
        </div>
        <div class="input-group">
          <input type="password" id="adminPassword" placeholder="Enter Admin Password" required />
        </div>
        <button type="submit" id="loginBtn">Login</button>
      </form>
    </div>
  </section>

  <!-- Admin Dashboard -->
  <main class="admin-dashboard hidden" id="adminDashboard">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo-circle small">R</div>
        <div>
          <h2>Raunak</h2>
          <p>Portfolio Admin</p>
        </div>
      </div>

      <nav class="admin-nav">
        <button class="nav-btn active" data-section="projects">
          <i class="fa-solid fa-code"></i> Projects
        </button>
        <button class="nav-btn" data-section="journey">
          <i class="fa-solid fa-timeline"></i> Journey
        </button>
        <button class="nav-btn" data-section="certificates">
          <i class="fa-solid fa-award"></i> Certificates
        </button>
        <button class="nav-btn" data-section="goals">
          <i class="fa-solid fa-bullseye"></i> Goals
        </button>
        <button class="nav-btn" data-section="feedback">
          <i class="fa-solid fa-comments"></i> Feedback
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" target="_blank" class="view-site-btn">
          <i class="fa-solid fa-globe"></i> Open Portfolio
        </a>
        <button id="logoutBtn" class="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <section class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileSidebarToggle">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <p class="mini-title">Dashboard</p>
            <h1 id="sectionTitle">Projects</h1>
          </div>
        </div>

        <button class="reset-btn" id="resetFormBtn">
          <i class="fa-solid fa-rotate-left"></i> Clear Form
        </button>
      </header>

      <section class="content-layout">

        <!-- Form Area -->
        <div class="form-panel" id="formPanel">
          <h2 id="formTitle">Add New Item</h2>

          <form id="itemForm">
            <div id="dynamicFields"></div>

            <button type="submit" class="save-btn" id="saveBtn">
              <i class="fa-solid fa-floppy-disk"></i> Save Item
            </button>
          </form>
        </div>

        <!-- List Area -->
        <div class="list-panel">
          <h2 id="listTitle">Saved Items</h2>
          <div id="itemsList"></div>
        </div>

      </section>
    </section>

  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
